[package]
name = "model2vec-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokenizers = "0.20"
safetensors = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
anyhow = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[bench]]
name = "benchmark"
harness = false
